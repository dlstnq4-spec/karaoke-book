<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도전! 우리들의 노래방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Jua&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void: #08050f;
    --chassis-1: #1a1030;
    --chassis-2: #120a24;
    --led-amber: #ffb400;
    --neon-magenta: #ff2d78;
    --neon-cyan: #21e6c1;
    --gold: #ffd23f;
    --cherry: #e63950;
    --screen-bg: #050a06;
    --text-dim: #8b7fae;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,45,120,0.12), transparent 45%),
      radial-gradient(circle at 80% 90%, rgba(33,230,193,0.12), transparent 45%),
      var(--bg-void);
    font-family:'Jua', sans-serif;
    color:#efe9ff;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 14px 60px;
  }

  .venue-title{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    font-family:'Black Han Sans', sans-serif;
    font-size:15px;
    letter-spacing:3px;
    color:var(--gold);
    text-shadow:0 0 12px rgba(255,210,63,0.6);
    opacity:0.85;
  }

  .global-banner{
    position:fixed;
    top:0; left:0; width:100%;
    z-index:200;
    text-align:center;
    padding:12px 16px;
    font-family:'Black Han Sans', sans-serif;
    font-size:15px;
    letter-spacing:1px;
    color:#08050f;
    background:linear-gradient(90deg, var(--gold), var(--led-amber));
    box-shadow:0 2px 20px rgba(255,180,0,0.5);
    transition:transform .25s ease, opacity .25s ease;
  }
  .global-banner.done{
    background:linear-gradient(90deg, var(--neon-cyan), #1fb6a1);
  }
  .global-banner.hidden{
    transform:translateY(-100%);
    opacity:0;
    pointer-events:none;
  }

  .machine{
    width:100%;
    max-width:460px;
    margin-top:44px;
    background:linear-gradient(160deg, var(--chassis-1), var(--chassis-2));
    border-radius:26px;
    padding:18px 18px 24px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:
      0 0 0 1px rgba(255,45,120,0.25),
      0 30px 60px -20px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.05);
    position:relative;
  }
  .machine::before{
    content:"";
    position:absolute; inset:-1px;
    border-radius:26px;
    padding:1px;
    background:linear-gradient(120deg, var(--neon-magenta), var(--neon-cyan), var(--gold), var(--neon-magenta));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity:0.5;
    pointer-events:none;
  }

  .brand-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:2px 6px 12px;
  }
  .brand{
    font-family:'Press Start 2P', monospace;
    font-size:10px;
    color:var(--neon-cyan);
    text-shadow:0 0 8px rgba(33,230,193,0.7);
  }
  .lamp-row{ display:flex; gap:6px; }
  .lamp{ width:8px; height:8px; border-radius:50%; background:var(--cherry); box-shadow:0 0 8px var(--cherry); animation:blink 2.4s infinite ease-in-out; }
  .lamp:nth-child(2){ background:var(--gold); box-shadow:0 0 8px var(--gold); animation-delay:.5s; }
  .lamp:nth-child(3){ background:var(--neon-cyan); box-shadow:0 0 8px var(--neon-cyan); animation-delay:1s; }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  /* SCREEN */
  .screen{
    position:relative;
    background:var(--screen-bg);
    border-radius:14px;
    height:230px;
    overflow:hidden;
    border:3px solid #000;
    box-shadow:inset 0 0 30px rgba(0,0,0,0.9), 0 0 0 2px rgba(33,230,193,0.15);
  }
  .scanlines{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.18) 3px
    );
    mix-blend-mode:multiply;
  }
  .scanlines::after{
    content:"";
    position:absolute; inset:0;
    animation:flicker 5s infinite;
    background:rgba(33,230,193,0.02);
  }
  @keyframes flicker{ 0%,97%,100%{opacity:1;} 98%{opacity:.85;} 99%{opacity:1;} }

  .screen-idle{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:10px;
  }
  .num-display{
    font-family:'Press Start 2P', monospace;
    font-size:34px;
    letter-spacing:10px;
    color:var(--led-amber);
    text-shadow:0 0 6px var(--led-amber), 0 0 20px rgba(255,180,0,0.6);
    min-height:40px;
  }
  .num-display.placeholder{ color:rgba(255,180,0,0.25); text-shadow:none; }

  .song-info{
    text-align:center; padding:0 16px;
  }
  .song-info .title{
    font-family:'Black Han Sans', sans-serif;
    font-size:20px;
    color:#fff;
    text-shadow:0 0 10px rgba(255,45,120,0.7);
  }
  .song-info .artist{
    font-size:13px;
    color:var(--neon-cyan);
    margin-top:4px;
  }

  .marquee-wrap{
    position:absolute; bottom:10px; left:0; width:100%;
    overflow:hidden; white-space:nowrap;
    color:var(--text-dim); font-size:12px;
  }
  .marquee{
    display:inline-block;
    padding-left:100%;
    animation:scrollmq 12s linear infinite;
  }
  @keyframes scrollmq{ 0%{transform:translateX(0);} 100%{transform:translateX(-100%);} }

  .status-msg{
    font-size:13px; color:var(--cherry); text-align:center; min-height:16px;
  }

  .research-link{
    display:block; margin:6px auto 0; background:none; border:none;
    color:var(--neon-cyan); font-family:'Jua',sans-serif; font-size:12px;
    text-decoration:underline; cursor:pointer;
  }

  /* KEYPAD */
  .keypad{
    margin-top:18px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
  }
  .key{
    font-family:'Press Start 2P', monospace;
    font-size:15px;
    padding:14px 0;
    border-radius:10px;
    border:none;
    cursor:pointer;
    background:linear-gradient(180deg, #2c2148, #1b1330);
    color:#e9e2ff;
    box-shadow:0 3px 0 #0c0818, inset 0 1px 0 rgba(255,255,255,0.08);
    transition:transform .05s ease;
  }
  .key:active{ transform:translateY(3px); box-shadow:0 0 0 #0c0818; }
  .key.func{
    font-family:'Jua', sans-serif;
    font-size:13px;
    color:var(--gold);
  }

  .action-row{
    margin-top:12px;
    display:grid;
    grid-template-columns:1fr 1.4fr;
    gap:10px;
  }
  .btn-confirm{
    font-family:'Jua', sans-serif;
    background:linear-gradient(180deg,#1fb6a1,var(--neon-cyan));
    color:#052018; font-size:15px; font-weight:bold;
    border:none; border-radius:12px; padding:16px 0; cursor:pointer;
    box-shadow:0 4px 0 #0c6b5c;
  }
  .btn-confirm:active{ transform:translateY(4px); box-shadow:none; }
  .btn-start{
    font-family:'Black Han Sans', sans-serif;
    background:linear-gradient(180deg,#ff5c7a,var(--cherry));
    color:#fff; font-size:18px; letter-spacing:2px;
    border:none; border-radius:12px; padding:16px 0; cursor:pointer;
    box-shadow:0 4px 0 #9c1830;
    text-shadow:0 0 10px rgba(255,255,255,0.4);
  }
  .btn-start:active{ transform:translateY(4px); box-shadow:none; }
  .btn-start:disabled, .btn-confirm:disabled{ opacity:.4; cursor:not-allowed; }

  .bottom-links{
    display:flex; justify-content:center; gap:18px;
    margin-top:14px;
  }
  .link-btn{
    background:none; border:none; color:var(--text-dim);
    font-family:'Jua', sans-serif; font-size:12px;
    text-decoration:underline; cursor:pointer;
  }
  .link-btn:hover{ color:var(--neon-cyan); }

  /* OVERLAY PANELS */
  .overlay{
    position:fixed; inset:0; background:rgba(5,2,12,0.82);
    display:flex; align-items:center; justify-content:center;
    z-index:50; padding:16px;
  }
  .hidden{ display:none; }
  .panel{
    width:100%; max-width:420px;
    background:linear-gradient(160deg,#1a1030,#120a24);
    border-radius:18px;
    border:1px solid rgba(255,255,255,0.1);
    padding:18px;
    max-height:82vh;
    display:flex; flex-direction:column;
  }
  .panel h2{
    font-family:'Black Han Sans', sans-serif;
    font-size:17px; margin:0 0 12px; color:var(--gold);
  }
  .field{ margin-bottom:10px; }
  .field label{ font-size:12px; color:var(--text-dim); display:block; margin-bottom:4px; }
  .field input{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
    background:#0d0818; color:#fff; font-family:'Jua',sans-serif; font-size:14px;
  }
  .panel-actions{ display:flex; gap:8px; margin-top:8px; }
  .panel-actions button{
    flex:1; padding:12px 0; border-radius:9px; border:none; cursor:pointer;
    font-family:'Jua',sans-serif; font-size:14px;
  }
  .btn-save{ background:var(--neon-cyan); color:#052018; font-weight:bold; }
  .btn-cancel{ background:#332a4d; color:#e9e2ff; }

  .search-input{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
    background:#0d0818; color:#fff; font-family:'Jua',sans-serif; font-size:14px; margin-bottom:10px;
  }
  .song-list{ overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:6px; }
  .song-row{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,0.04); border-radius:9px; padding:9px 12px;
    cursor:pointer;
  }
  .song-row:hover{ background:rgba(33,230,193,0.12); }
  .song-row .num{ font-family:'Press Start 2P', monospace; font-size:11px; color:var(--led-amber); margin-right:10px; }
  .song-row .info{ flex:1; }
  .song-row .info .t{ font-size:14px; }
  .song-row .info .a{ font-size:11px; color:var(--text-dim); }
  .del-btn{ background:none; border:none; color:var(--cherry); font-size:16px; cursor:pointer; padding:4px 6px; }
  .empty-note{ text-align:center; color:var(--text-dim); font-size:13px; padding:20px 0; }

  .loading-note{ text-align:center; color:var(--text-dim); font-size:12px; padding:8px 0; }

  @media (max-width:400px){
    .num-display{ font-size:26px; letter-spacing:6px; }
  }
</style>
</head>
<body>

<div class="venue-title">♪ 도전! 우리들의 노래방 ♪</div>

<div id="globalBanner" class="global-banner hidden">
  <span id="globalBannerText"></span>
</div>

<div class="machine">
  <div class="brand-row">
    <div class="brand">SING-1000</div>
    <div class="lamp-row"><span class="lamp"></span><span class="lamp"></span><span class="lamp"></span></div>
  </div>

  <div class="screen" id="screen">
    <div class="scanlines"></div>

    <div class="screen-idle" id="screenIdle">
      <div class="num-display placeholder" id="numDisplay">‾ ‾ ‾ ‾</div>
      <div class="song-info" id="songInfo" style="display:none;">
        <div class="title" id="songTitle"></div>
        <div class="artist" id="songArtist"></div>
      </div>
      <div class="status-msg" id="statusMsg"></div>
      <button class="research-link hidden" id="researchBtn">🔄 다른 영상으로 다시 찾기</button>
    </div>

    <div class="marquee-wrap">
      <span class="marquee" id="marqueeText">번호를 입력하고 확인을 눌러주세요 ▶ 등록된 곡이 없다면 [곡 등록]으로 추가해보세요 ▶</span>
    </div>
  </div>

  <div class="keypad" id="keypad">
    <button class="key" data-num="1">1</button>
    <button class="key" data-num="2">2</button>
    <button class="key" data-num="3">3</button>
    <button class="key" data-num="4">4</button>
    <button class="key" data-num="5">5</button>
    <button class="key" data-num="6">6</button>
    <button class="key" data-num="7">7</button>
    <button class="key" data-num="8">8</button>
    <button class="key" data-num="9">9</button>
    <button class="key func" id="clearBtn">지움</button>
    <button class="key" data-num="0">0</button>
    <button class="key func" id="backBtn">←</button>
  </div>

  <div class="action-row">
    <button class="btn-confirm" id="confirmBtn">확인</button>
    <button class="btn-start" id="startBtn" disabled>▶ 시 작</button>
  </div>

  <div id="linkFillRow" class="hidden" style="margin-top:10px; background:rgba(255,255,255,0.04); border-radius:10px; padding:10px;">
    <div style="font-size:12px; color:var(--text-dim); margin-bottom:6px;">새 탭에서 원하는 노래방 영상을 찾아 링크를 복사한 뒤 붙여넣어주세요</div>
    <input id="linkFillInput" placeholder="https://www.youtube.com/watch?v=..." style="width:100%; padding:9px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.15); background:#0d0818; color:#fff; font-family:'Jua',sans-serif; font-size:13px; margin-bottom:8px;">
    <button id="linkFillSaveBtn" style="width:100%; padding:11px 0; border-radius:8px; border:none; background:var(--neon-cyan); color:#052018; font-family:'Jua',sans-serif; font-size:14px; font-weight:bold; cursor:pointer;">저장하고 재생</button>
  </div>

  <div class="bottom-links">
    <button class="link-btn" id="openBookBtn">📖 곡책 보기</button>
    <button class="link-btn" id="openRegisterBtn">➕ 곡 등록</button>
    <button class="link-btn" id="openBulkBtn">📋 여러 곡 한번에</button>
    <button class="link-btn" id="shuffleBtn">🔀 번호 섞기</button>
  </div>
</div>

<!-- 곡책 -->
<div class="overlay hidden" id="bookOverlay">
  <div class="panel">
    <h2>📖 등록곡 목록</h2>
    <input class="search-input" id="searchInput" placeholder="제목, 가수, 번호로 검색">
    <div class="song-list" id="songListEl">
      <div class="loading-note">불러오는 중...</div>
    </div>
    <div class="panel-actions">
      <button class="btn-cancel" id="closeBookBtn">닫기</button>
    </div>
  </div>
</div>

<!-- 일괄 등록 -->
<div class="overlay hidden" id="bulkOverlay">
  <div class="panel">
    <h2>📋 여러 곡 한번에 등록</h2>
    <div class="field" style="margin-bottom:6px;">
      <label>메모장에 적은 곡 목록을 그대로 붙여넣으세요. 아래 두 형식 모두 지원해요.<br>
      ① <b>번호. 가수 - 제목</b> (링크 없이 – 나중에 재생할 때 링크를 찾아 채워요)<br>
      ② <b>번호,제목,가수,유튜브링크</b> (링크까지 바로 등록)</label>
      <textarea id="bulkText" rows="8" placeholder="1. 먼데이 키즈 - 이런남자
2. 먼데이 키즈 - 흉터
1004,좋은 날,아이유,https://www.youtube.com/watch?v=xxxxxxxxxxx" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:#0d0818;color:#fff;font-family:'Jua',sans-serif;font-size:13px;resize:vertical;"></textarea>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);margin-bottom:8px;">
      <input type="checkbox" id="bulkOverwrite" style="width:16px;height:16px;">
      이미 등록된 번호는 덮어쓰기
    </label>
    <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);margin-bottom:8px;">
      <input type="checkbox" id="bulkShuffle" style="width:16px;height:16px;" checked>
      번호는 그대로, 가수·제목 순서를 섞어서 등록 (같은 가수 곡이 몰리지 않게)
    </label>
    <div class="status-msg" id="bulkMsg" style="min-height:32px; white-space:pre-line;"></div>
    <div class="panel-actions">
      <button class="btn-cancel" id="cancelBulkBtn">취소</button>
      <button class="btn-save" id="saveBulkBtn">가져오기</button>
    </div>
  </div>
</div>

<!-- 등록 -->
<div class="overlay hidden" id="registerOverlay">
  <div class="panel">
    <h2>➕ 곡 등록하기</h2>
    <div class="field">
      <label>노래방 번호 (숫자, 최대 4자리)</label>
      <input id="regNumber" inputmode="numeric" maxlength="4" placeholder="예: 1004">
    </div>
    <div class="field">
      <label>곡 제목</label>
      <input id="regTitle" placeholder="예: 좋은 날">
    </div>
    <div class="field">
      <label>가수</label>
      <input id="regArtist" placeholder="예: 아이유">
    </div>
    <div class="field">
      <label>유튜브 링크 (노래방/MR 영상 주소)</label>
      <input id="regUrl" placeholder="https://www.youtube.com/watch?v=...">
    </div>
    <div class="status-msg" id="regMsg" style="min-height:16px;"></div>
    <div class="panel-actions">
      <button class="btn-cancel" id="cancelRegisterBtn">취소</button>
      <button class="btn-save" id="saveRegisterBtn">저장</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script>
(function(){
  // 유튜브 자동 검색용 API 키 (YouTube Data API v3)
  const YOUTUBE_API_KEY = "AIzaSyAsLrs7r_-opTnCzv5ycJ5yq0uNdUQTQQI";

  async function searchKaraokeVideoIds(artist, title){
    const q = encodeURIComponent((artist ? artist + ' ' : '') + title + ' 노래방');
    const searchUrl = 'https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=1&type=video&q=' + q + '&key=' + YOUTUBE_API_KEY;
    const res = await fetch(searchUrl);
    if(!res.ok){ throw new Error('YouTube API error: ' + res.status); }
    const data = await res.json();
    const ids = (data.items || [])
      .map(it => it.id && it.id.videoId)
      .filter(Boolean);
    return ids;
  }

  // 실시간 공유 저장소: Firebase Realtime Database
  // (모든 방문자가 같은 곡책을 실시간으로 보고 수정할 수 있게 해줌)
  const firebaseConfig = {
    apiKey: "AIzaSyCrBIY-KnEr2zdLe3lyt7lfcL0aCSEK4mM",
    authDomain: "karaoke-book-db128.firebaseapp.com",
    databaseURL: "https://karaoke-book-db128-default-rtdb.firebaseio.com",
    projectId: "karaoke-book-db128",
    storageBucket: "karaoke-book-db128.firebasestorage.app",
    messagingSenderId: "1080225345113",
    appId: "1:1080225345113:web:5d30e916555367a473cb48"
  };

  function keyToPath(key){
    // 'song:1004' -> 'songs/1004', 'meta:lastShuffle' -> 'meta/lastShuffle'
    const idx = key.indexOf(':');
    if(idx === -1) return key;
    const ns = key.slice(0, idx);
    const rest = key.slice(idx + 1);
    const nsPath = (ns === 'song') ? 'songs' : ns;
    return nsPath + '/' + rest;
  }

  let firebaseReady = false;
  try{
    if(typeof firebase !== 'undefined'){
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      window.storage = {
        async get(key){
          const snap = await db.ref(keyToPath(key)).once('value');
          if(!snap.exists()){ throw new Error('key not found: ' + key); }
          return { key, value: JSON.stringify(snap.val()), shared: true };
        },
        async set(key, value){
          await db.ref(keyToPath(key)).set(JSON.parse(value));
          return { key, value, shared: true };
        },
        async delete(key){
          await db.ref(keyToPath(key)).remove();
          return { key, deleted: true, shared: true };
        },
        async list(){
          const snap = await db.ref('songs').once('value');
          const keys = [];
          if(snap.exists()){
            snap.forEach(child => { keys.push('song:' + child.key); });
          }
          return { keys, prefix: 'song:', shared: true };
        },
        // 여러 곡을 한 번의 네트워크 요청으로 한꺼번에 저장 (훨씬 빠름)
        async bulkSetSongs(numberToPayload){

          for(const number in numberToPayload){

      async get(key){
        const raw = localStorage.getItem(LS_PREFIX + key);
        if(raw === null){ throw new Error('key not found: ' + key); }
        return { key, value: raw, shared: false };
      },
      async set(key, value){
        localStorage.setItem(LS_PREFIX + key, value);
        return { key, value, shared: false };
      },
      async delete(key){
        localStorage.removeItem(LS_PREFIX + key);
        return { key, deleted: true, shared: false };
      },
      async list(prefix){
        const p = LS_PREFIX + (prefix || '');
        const keys = [];
        for(let i=0; i<localStorage.length; i++){
          const k = localStorage.key(i);
          if(k && k.indexOf(p) === 0){
            keys.push(k.slice(LS_PREFIX.length));
          }
        }
        return { keys, prefix: prefix || '', shared: false };
      },
      async bulkSetSongs(numberToPayload){
        for(const number in numberToPayload){
          localStorage.setItem(LS_PREFIX + 'song:' + number, numberToPayload[number]);

  function parseBulkLine(line){
    line = line.trim();
    if(!line) return null;

    // 링크가 포함된 줄: 번호,제목,가수,링크 (쉼표 또는 탭 구분)
    if(/https?:\/\//i.test(line)){
      const parts = line.includes('\t') ? line.split('\t') : line.split(',');
      const trimmed = parts.map(p=>p.trim()).filter((p,i)=> !(i===0 && p===''));
      if(trimmed.length < 3) return {error:'형식 오류: "' + line + '"'};
      let number, title, artist, urlRaw;
      if(trimmed.length >= 4){
        number = trimmed[0]; title = trimmed[1]; artist = trimmed[2];
        urlRaw = trimmed.slice(3).join(',');
      } else {
        number = trimmed[0]; title = trimmed[1]; artist = ''; urlRaw = trimmed[2];
      }
      if(!/^\d{1,4}$/.test(number)) return {error:'번호는 1~4자리 숫자여야 해요: "' + line + '"'};
      if(!title) return {error:'제목이 비어있어요: "' + line + '"'};
      const videoId = extractVideoId(urlRaw);
      if(!videoId) return {error:'유튜브 링크를 찾을 수 없어요: "' + line + '"'};
      return {number, title, artist, videoId};
    }

    // 링크 없는 줄: "번호. 가수 - 제목" 형식
    const m = line.match(/^(\d{1,4})\s*[\.\)\:]?\s*(.+)$/);
    if(!m) return {error:'형식을 알아볼 수 없어요: "' + line + '"'};
    const number = m[1];
    const rest = m[2].trim();
    if(!rest) return {error:'제목이 비어있어요: "' + line + '"'};
    let artist = '', title = rest;
    const dashIdx = rest.indexOf(' - ');
    if(dashIdx !== -1){
      artist = rest.slice(0, dashIdx).trim();
      title = rest.slice(dashIdx+3).trim();
    }
    if(!title) return {error:'제목을 찾을 수 없어요: "' + line + '"'};
    return {number, title, artist, videoId: null};
  }

  document.getElementById('saveBulkBtn').addEventListener('click', async ()=>{
    const raw = document.getElementById('bulkText').value;
    const overwrite = document.getElementById('bulkOverwrite').checked;
    const shuffleOrder = document.getElementById('bulkShuffle').checked;
    const msgEl = document.getElementById('bulkMsg');
    const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length>0);

    if(lines.length === 0){
      msgEl.textContent = '먼저 곡 목록을 붙여넣어주세요';
      return;
    }

    // 1단계: 전부 파싱해서 정상 항목과 오류 항목을 나눔
    const validEntries = [];
    const errorLines = [];
    for(const line of lines){
      const parsed = parseBulkLine(line);
      if(!parsed) continue;
      if(parsed.error){ errorLines.push(parsed.error); continue; }
      validEntries.push(parsed);
    }

    // 2단계: 원하면 번호는 그대로 두고 곡 내용(가수/제목/링크)만 섞기 (Fisher-Yates)
    if(shuffleOrder && validEntries.length > 1){
      const payloads = validEntries.map(e => ({ title: e.title, artist: e.artist, videoId: e.videoId }));
      for(let i=payloads.length-1; i>0; i--){
        const j = Math.floor(Math.random()*(i+1));
        [payloads[i], payloads[j]] = [payloads[j], payloads[i]];
      }
      for(let i=0; i<validEntries.length; i++){
        validEntries[i].title = payloads[i].title;
        validEntries[i].artist = payloads[i].artist;
        validEntries[i].videoId = payloads[i].videoId;
      }
    }

    msgEl.textContent = '가져오는 중... (0/' + validEntries.length + ')';
    showBanner(validEntries.length + '곡 업로드 중입니다... (0/' + validEntries.length + ')');

    let okCount = 0, skipCount = 0, errCount = errorLines.length, pendingCount = 0;

    for(let i=0; i<validEntries.length; i++){
      msgEl.textContent = '가져오는 중... (' + (i+1) + '/' + validEntries.length + ')';
      showBanner(validEntries.length + '곡 업로드 중입니다... (' + (i+1) + '/' + validEntries.length + ')');
      const parsed = validEntries[i];
      try{
        if(!overwrite){
          const existing = await window.storage.get('song:' + parsed.number, true).catch(()=>null);
          if(existing && existing.value){
            skipCount++;
            continue;
          }
        }
        const payload = JSON.stringify({title: parsed.title, artist: parsed.artist, videoId: parsed.videoId});
        const res = await window.storage.set('song:' + parsed.number, payload, true);
        if(res){
          okCount++;
          if(!parsed.videoId) pendingCount++;
        } else {
          errCount++; errorLines.push(parsed.number + '번 저장 실패');
        }
      }catch(err){
        errCount++;
        errorLines.push(parsed.number + '번 저장 중 오류');
      }
    }

    let summary = okCount + '곡 등록 완료';
    if(shuffleOrder) summary += ' (가수·제목 순서 섞음)';
    if(pendingCount>0) summary += ' (이 중 ' + pendingCount + '곡은 링크가 없어서, 재생 시 [🔍 유튜브에서 찾기]로 채워야 해요)';
    if(skipCount>0) summary += ' · ' + skipCount + '곡 건너뜀(중복)';
    if(errCount>0) summary += ' · ' + errCount + '곡 실패';
    if(errorLines.length>0){
      summary += '\n' + errorLines.slice(0,5).join('\n');
      if(errorLines.length>5) summary += '\n...외 ' + (errorLines.length-5) + '건';
    }
    msgEl.textContent = summary;

    showBanner('✅ 업로드 완료! ' + okCount + '곡 등록됨 · 시작 가능합니다', true);
    hideBannerAfter(5000);
  });

  const bookOverlay = document.getElementById('bookOverlay');

  let allSongs = [];

  async function fetchAllSongs(onProgress){
    const listRes = await window.storage.list('song:', true);
    const keys = (listRes && listRes.keys) ? listRes.keys : [];
    const songs = [];
    for(let i=0; i<keys.length; i++){
      const key = keys[i];
      try{
        const r = await window.storage.get(key, true);
        if(r && r.value){
          const data = JSON.parse(r.value);
          songs.push({ number: key.replace('song:',''), ...data });
        }
      }catch(e){ /* skip broken entry */ }
      if(onProgress) onProgress(i+1, keys.length);
    }
    songs.sort((a,b)=> Number(a.number) - Number(b.number));
    return songs;
  }

  async function loadAllSongs(){
    songListEl.innerHTML = '<div class="loading-note">불러오는 중...</div>';

    if(filtered.length === 0){
      songListEl.innerHTML = '<div class="empty-note">등록된 곡이 없어요.<br>➕ 곡 등록으로 추가해보세요!</div>';

    songListEl.innerHTML = '';
    filtered.forEach(song=>{

        '<div class="a">' + escapeHtml(song.artist||'') + '</div></span>' +
        '<button class="del-btn" title="삭제">✕</button>';
      row.querySelector('.info').addEventListener('click', ()=>{

      row.querySelector('.num').addEventListener('click', ()=>{

      row.querySelector('.del-btn').addEventListener('click', async (e)=>{

        try{
          await window.storage.delete('song:' + song.number, true);
          allSongs = allSongs.filter(s=>s.number !== song.number);
          renderSongList(document.getElementById('searchInput').value);
        }catch(err){ alert('삭제에 실패했어요'); }
      });
      songListEl.appendChild(row);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('openBookBtn').addEventListener('click', ()=>{
    bookOverlay.classList.remove('hidden');
    document.getElementById('searchInput').value = '';
    loadAllSongs();
  });
  document.getElementById('closeBookBtn').addEventListener('click', ()=>{
    bookOverlay.classList.add('hidden');
  });
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    renderSongList(e.target.value);
  });

  /* ---------- 번호 섞기 ---------- */
  const shuffleBtn = document.getElementById('shuffleBtn');
  const AUTO_SHUFFLE_INTERVAL_MS = 12 * 60 * 60 * 1000; // 12시간

  // silent=true면 확인창/알림 없이 조용히 실행 (자동 섞기용)
  async function shuffleAllSongs(silent){
    if(!silent){
      shuffleBtn.disabled = true;
    }
    const originalLabel = shuffleBtn.textContent;
    if(!silent) shuffleBtn.textContent = '불러오는 중...';

    try{
      const songs = await fetchAllSongs((done,total)=>{
        if(!silent) shuffleBtn.textContent = '불러오는 중... (' + done + '/' + total + ')';
        showBanner(total + '곡 정보를 불러오는 중입니다... (' + done + '/' + total + ')');
      });

      if(songs.length < 2){
        if(!silent) alert('섞을 곡이 충분하지 않아요 (2곡 이상 등록되어 있어야 해요)');
        return;
      }

      const numbers = songs.map(s=>s.number);
      const payloads = songs.map(s=>({title:s.title, artist:s.artist, videoId:s.videoId}));

      // Fisher-Yates: payloads만 섞고 numbers는 그대로 두어 번호<->곡 매칭을 재배정
      for(let i=payloads.length-1; i>0; i--){
        const j = Math.floor(Math.random()*(i+1));
        [payloads[i], payloads[j]] = [payloads[j], payloads[i]];
      }

      showBanner(numbers.length + '곡 번호를 섞는 중입니다...');
      if(!silent) shuffleBtn.textContent = '섞는 중...';

      // 한 곡씩 순서대로 저장하지 않고, 전부 한 번의 요청으로 한꺼번에 저장 (훨씬 빠름)
      const numberToPayload = {};
      for(let i=0; i<numbers.length; i++){
        numberToPayload[numbers[i]] = payloads[i];
      }
      await window.storage.bulkSetSongs(numberToPayload);

      buffer = '';
      renderBuffer();
      resetSongState();
      statusMsg.textContent = '🔀 번호가 모두 섞였어요! 다시 확인해보세요';

      if(!bookOverlay.classList.contains('hidden')){
        loadAllSongs();
      }

      showBanner('✅ 번호 섞기 완료! 시작 가능합니다', true);
      hideBannerAfter(4000);
    }catch(err){
      if(!silent) alert('섞는 중 오류가 발생했어요. 잠시 후 다시 시도해주세요');
      globalBanner.classList.add('hidden');
    }finally{
      if(!silent){
        shuffleBtn.disabled = false;
        shuffleBtn.textContent = originalLabel;
      }
    }
  }

  shuffleBtn.addEventListener('click', async ()=>{
    const sure = confirm('등록된 모든 곡의 번호를 무작위로 뒤섞을까요?\n(모두에게 공유된 곡책이 바뀌며, 되돌릴 수 없어요)');
    if(!sure) return;
    await shuffleAllSongs(false);
  });

  // 마지막으로 섞은 지 12시간이 지났으면, 누군가 접속했을 때 자동으로 한 번 섞는다.
  async function checkAutoShuffle(){
    try{
      let last = 0;
      try{
        const res = await window.storage.get('meta:lastShuffle', true);
        last = res && res.value ? JSON.parse(res.value) : 0;
      }catch(e){ last = 0; }

      const now = Date.now();
      if(now - last < AUTO_SHUFFLE_INTERVAL_MS) return;

      // 여러 명이 동시에 접속해도 중복 실행을 줄이기 위해, 먼저 시각을 찜해둠
      await window.storage.set('meta:lastShuffle', JSON.stringify(now), true);
      await shuffleAllSongs(true);
    }catch(e){ /* 자동 섞기 실패해도 조용히 무시 */ }
  }
  checkAutoShuffle();

})();
</script>
</body>
</html>
